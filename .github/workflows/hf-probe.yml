name: Probe free public UK jobs dataset

on:
  push:
    paths:
      - scripts/hf_probe.py
      - .github/workflows/hf-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - run: python -u scripts/hf_probe.py
