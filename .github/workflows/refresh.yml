name: Refresh sponsor evidence and job feeds
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/jobs.json'
      - 'data/sponsors.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: sponsorship-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify importer and classification tests
        run: python -m unittest discover -s tests -v
      - name: Refresh official register and employer feeds
        run: python scripts/refresh.py
      - name: Validate new data
        run: python -m unittest discover -s tests -v
      - name: Commit source-backed data without rewriting other changes
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/sponsor-index
          cp data/jobs.json data/sponsors.json /tmp/sponsor-index/
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sponsor-index/jobs.json /tmp/sponsor-index/sponsors.json data/
            git add data/jobs.json data/sponsors.json
            if git diff --cached --quiet; then
              echo 'No fresh data changes to push.'
              exit 0
            fi
            git commit -m 'data: refresh source-backed vacancy and sponsor evidence'
            if git push origin HEAD:main; then
              echo 'Source-backed data pushed.'
              exit 0
            fi
            echo "Concurrent update detected; fetching latest branch, retry $attempt"
            sleep 2
          done
          echo "::error::Could not update indexes without a concurrent conflict"
          exit 1
