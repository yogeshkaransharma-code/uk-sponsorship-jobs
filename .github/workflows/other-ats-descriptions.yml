name: Recover Workday and SmartRecruiters descriptions

on:
  schedule:
    - cron: '29 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsorhq-other-ats-descriptions
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public ATS URL controls and job mapping
        run: python -m unittest discover -s tests -v
      - name: Read a bounded batch of public SmartRecruiters and Workday adverts
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -u scripts/enrich_other_ats.py --first
          else
            python -u scripts/enrich_other_ats.py
          fi
      - name: Validate combined SponsorHQ build
        run: python scripts/build_site.py
      - name: Save descriptions and sponsorship wording
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/enriched/ats-details-*.json /tmp/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/enriched
            cp /tmp/ats-details-*.json data/enriched/
            git add data/enriched/ats-details-*.json
            if git diff --cached --quiet; then
              echo 'No additional descriptions to save.'
              exit 0
            fi
            git commit -m 'data: add UK Workday and SmartRecruiters job descriptions'
            if git push origin HEAD:main; then
              echo 'Additional job descriptions committed.'
              exit 0
            fi
            sleep 3
          done
          exit 1
